# LA_BOT on your own computer. Needs Docker (Docker Desktop on Windows/macOS).
#
#   docker compose up --build        # first run builds the images (a few minutes)
#   docker compose up -d             # start again in the background
#   docker compose down              # stop (data is kept; add -v to wipe it)
#
#   Website            http://localhost:3000
#   Advocate portal    http://localhost:3001
#   API + docs         http://localhost:8000  (docs at /docs)
#
# Everything works without API keys (sources-only answers, template drafts).
# To add AI answers, copy .env.example to .env and fill in GEMINI_API_KEY and/or
# GROQ_API_KEY. Every setting below has a default; .env only overrides them.
#
# Developing instead of running images? Start just the database and cache:
#   docker compose up -d db redis        (then see README: pnpm dev / pnpm api:dev)

name: la-bot

x-api-env: &api-env
  APP_ENV: development
  LOG_FORMAT: console
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@db:5432/${POSTGRES_DB:-legal_platform}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@db:5432/${POSTGRES_DB:-legal_platform}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-me-0123456789abcdef}
  CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:${ADVOCATE_PORTAL_PORT:-3001}
  FRONTEND_BASE_URL: http://localhost:${WEB_PORT:-3000}
  OPEN_LOGIN: ${OPEN_LOGIN:-true}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@labot.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
  ADVOCATES_CSV_PATH: data/advocates.csv
  # AI (all optional)
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-auto}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-flash-latest}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
  AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
  # Legal documents from Hugging Face (needs internet; works without any key)
  HF_TOKEN: ${HF_TOKEN:-}
  HF_DATASET_NAME: ${HF_DATASET_NAME:-Sumitedu/indian-case-laws}
  HF_DATASET_SPLIT: ${HF_DATASET_SPLIT:-}
  HF_DATASET_FILE: ${HF_DATASET_FILE:-}
  HF_MAX_DOCUMENTS: ${HF_MAX_DOCUMENTS:-200}
  HF_BATCH_SIZE: ${HF_BATCH_SIZE:-20}
  LEGAL_CORPUS_AUTOLOAD: ${LEGAL_CORPUS_AUTOLOAD:-true}
  LEGAL_CORPUS_EMBED_ON_START: ${LEGAL_CORPUS_EMBED_ON_START:-true}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-legal_platform}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal} -d ${POSTGRES_DB:-legal_platform}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: apps/api
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  advocate-portal:
    build:
      context: .
      dockerfile: apps/advocate-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADVOCATE_PORTAL_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  db-data:
