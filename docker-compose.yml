# Run the whole app on your computer (needs Docker Desktop):
#
#   docker compose up --build
#
# Website: http://localhost:8080   API docs: http://localhost:8080/docs
# Put your AI key in a file named .env next to this file:
#   GEMINI_API_KEY=your-key-from-aistudio.google.com
# Local admin (CSV upload at /advocates/import): admin@labot.local / admin12345
name: labot

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: labot
      POSTGRES_PASSWORD: labot
      POSTGRES_DB: labot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labot -d labot']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    environment:
      PORT: '8080'
      APP_ENV: development
      LOG_FORMAT: console
      DATABASE_URL: postgresql://labot:labot@db:5432/labot
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-not-for-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-flash-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPEN_LOGIN: ${OPEN_LOGIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@labot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    restart: unless-stopped

volumes:
  db-data:
